<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>W10 – Virtual Trackball</title>

    <script src="../util/MV.js"></script>
    <script src="../util/quaternion.js"></script>
    <link rel="stylesheet" href="../styles.css">
    <script src="../util/OBJParser.js"></script>
    <script defer src="main.js"></script>
  </head>

  <body>
    <div id="ui">
      <label>
        <input type="checkbox" id="bounceToggle" checked>
        Animate teapot up/down
      </label>
      <label>
        <input type="checkbox" id="lightToggle" checked>
        Animate light
      </label>

      <small>
        <strong>Left-click + drag:</strong> Orbit camera | 
        <strong>Middle-click + drag:</strong> Pan view | 
        <strong>Right-click + drag:</strong> Dolly (zoom)
      </small>
    </div>

    <canvas id="gpu-canvas" width="960" height="540"></canvas>
  </body>
